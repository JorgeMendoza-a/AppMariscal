name: Construir APK Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar firma (si hay secrets configurados)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Usando firma privada"
          else
            echo "::warning::Sin secret ANDROID_KEYSTORE_BASE64: la APK se firma con clave de depuración"
          fi

      - name: Compilar APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk MariscalShop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MariscalShop-apk
          path: MariscalShop.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Mariscal Shop para Android
          make_latest: true
          files: MariscalShop.apk
          body: |
            📲 **Descarga:** toca `MariscalShop.apk` abajo, en *Assets*.

            Para instalar: abre el archivo descargado y, si Android lo pide, permite
            "Instalar apps desconocidas" para tu navegador o el administrador de archivos.

            Compilación #${{ github.run_number }} — `${{ github.sha }}`
